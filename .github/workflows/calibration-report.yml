name: MatchLab historical calibration report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/calibration_report.py'
      - '.github/workflows/calibration-report.yml'
      - 'calibration.py'
      - 'football_models.py'

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.11,<2' 'pandas>=2,<3' 'requests>=2.31,<3'
      - name: Generate five-league historical calibration report
        run: python scripts/calibration_report.py
      - name: Upload report and rolling-fold results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchlab-calibration-report
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish machine-readable report to repository
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p reports
          cp artifacts/calibration_report.json reports/latest_calibration.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest_calibration.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish latest historical calibration audit [skip ci]"
            for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 3
          done
          echo "Calibration publication failed after retries" >&2
          exit 1
          fi
