name: MatchLab model comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/model_comparison.py'
      - 'historical_market_validation.py'
      - 'scripts/validate_historical_markets.py'
      - 'elo_baseline.py'
      - 'bayesian_goals.py'
      - 'model_uncertainty.py'
      - 'football_models.py'
      - '.github/workflows/model-comparison.yml'

permissions:
  contents: write

concurrency:
  group: matchlab-model-comparison-publish
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2.0' 'scipy>=1.11,<2' 'requests>=2.31'
      - name: Run paired chronological evaluation
        run: python scripts/model_comparison.py
      - name: Evaluate chronological goal-market research
        run: python scripts/validate_historical_markets.py
      - name: Publish model report for website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/model_comparison.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public model comparison report'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep 3
            done
            echo 'Unable to publish after retries' >&2
            exit 1
          fi
      - name: Upload complete comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchlab-model-comparison
          path: |
            artifacts/model_comparison.json
            artifacts/model_comparison_predictions.csv
            artifacts/historical_market_predictions.csv
            reports/historical_market_validation.json
          if-no-files-found: warn
