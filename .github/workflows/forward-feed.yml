name: Forward forecast candidate collection (manual dev verification)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    if: github.ref == 'refs/heads/feature/forward-multimarket-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install forecasting dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.11,<2' 'pandas>=2,<3' 'requests>=2.31,<3'
      - name: Verify provider credential exists
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ -z "$FOOTBALL_DATA_TOKEN" ]; then
            echo "::error::FOOTBALL_DATA_TOKEN secret is missing; live fixtures cannot be collected"
            exit 1
          fi
      - name: Collect pre-kickoff candidate forecasts
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/collect_forward.py --provider artifacts/forward_ledger.json
      - name: Upload immutable review candidate and coverage report
        uses: actions/upload-artifact@v4
        with:
          name: forward-candidate-${{ github.run_id }}
          path: |
            artifacts/forward_ledger.candidate.json
            artifacts/forward_coverage.json
          retention-days: 14
