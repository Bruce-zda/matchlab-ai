name: MatchLab development data collection test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-dev-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out development branch only
        uses: actions/checkout@v4
        with:
          ref: feature/forward-multimarket-validation
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install forecasting dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.11,<2' 'pandas>=2,<3' 'requests>=2.31,<3'
      - name: Verify provider credential is configured
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ -z "$FOOTBALL_DATA_TOKEN" ]; then
            echo "::error::FOOTBALL_DATA_TOKEN is not configured"
            exit 1
          fi
      - name: Generate development candidate forecasts
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/collect_forward.py --provider artifacts/forward_ledger.json
      - name: Upload review artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: matchlab-development-candidate-${{ github.run_id }}
          path: |
            artifacts/forward_ledger.candidate.json
            artifacts/forward_coverage.json
          if-no-files-found: error
          retention-days: 14
