name: MatchLab quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.11,<2' 'pandas>=2,<3' 'requests>=2.31,<3'
      - name: Check Python syntax
        run: python -m py_compile app.py football_models.py scripts/collect_forward.py goal_markets.py forward_validation.py
      - name: Run source regression tests
        run: python -m unittest discover -s tests -v
