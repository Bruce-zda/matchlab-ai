name: MatchLab offline model timing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark_preview_models.py'
      - '.github/workflows/model-timing.yml'
      - 'scripts/benchmark_snapshot_reload.py'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.11,<2' 'pandas>=2,<3' 'requests>=2.31,<3'
      - name: Benchmark synthetic model fitting and inference
        run: python scripts/benchmark_preview_models.py --matches 240 --repeats 2 --output model-timing.json
      - name: Benchmark persisted model snapshot reload
        run: python scripts/benchmark_snapshot_reload.py | tee snapshot-timing.json
      - name: Publish benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: matchlab-offline-model-timing
          path: |
            model-timing.json
            snapshot-timing.json
