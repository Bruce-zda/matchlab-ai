name: MatchLab forward selection research audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'forward_selection_validation.py'
      - 'scripts/validate_forward_selection.py'
      - 'tests/test_forward_selection_validation.py'
      - 'artifacts/forward_ledger.json'
      - 'artifacts/forward_settlements.json'
      - '.github/workflows/forward-selection-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run forward selection audit
        run: python scripts/validate_forward_selection.py
      - name: Publish research evidence as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: matchlab-forward-selection-audit
          path: reports/forward_selection_validation.json
          if-no-files-found: error
