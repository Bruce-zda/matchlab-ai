name: MatchLab fixture source audit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6,12,18 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source dependencies
        run: python -m pip install 'requests>=2.31'
      - name: Check provider fixtures and results
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/audit_fixture_provider.py
      - name: Upload source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchlab-fixture-source-audit
          path: artifacts/provider_fixture_audit.json
          if-no-files-found: warn
