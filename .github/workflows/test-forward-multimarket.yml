name: Validate forward multimarket research
on:
  push:
    branches:
      - feature/forward-multimarket-validation
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'requests>=2.31,<3'
      - name: Run isolated forward-validation tests
        run: |
          python -m unittest discover -s tests -p 'test_forward_*validation.py' -v
          python -m unittest discover -s tests -p 'test_frozen_screen_integrity.py' -v
          python -m unittest discover -s tests -p 'test_collector_integration.py' -v
          python -m unittest discover -s tests -p 'test_match_intelligence_view.py' -v
      - name: Evaluate existing archived snapshots without backfilling
        run: python scripts/validate_live_screen.py
      - name: Upload read-only forward screen report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matchlab-forward-live-screen-audit
          path: reports/forward_live_screen_validation.json
          if-no-files-found: warn
