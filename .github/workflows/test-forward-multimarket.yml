name: Validate forward multimarket research
on:
  push:
    branches:
      - feature/forward-multimarket-validation
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Run isolated forward-validation tests
        run: python -m unittest discover -s tests -p 'test_forward_*validation.py' -v
